spring:
  application:
    name: opensearch-utility
  cloud:
    function:
      definition: topicAConsumer;topicBConsumer;topicCConsumer;topicDConsumer;topicEConsumer;topicFConsumer;topicGConsumer;topicHConsumer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          auto-create-topics: false
          consumer-properties:
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value.deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
            auto.offset.reset: earliest
            enable.auto.commit: false
      bindings:
        topicAConsumer-in-0:
          destination: topic-a
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicBConsumer-in-0:
          destination: topic-b
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicCConsumer-in-0:
          destination: topic-c
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicDConsumer-in-0:
          destination: topic-d
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicEConsumer-in-0:
          destination: topic-e
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicFConsumer-in-0:
          destination: topic-f
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicGConsumer-in-0:
          destination: topic-g
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1
        topicHConsumer-in-0:
          destination: topic-h
          group: ${KAFKA_CONSUMER_GROUP:opensearch-utility}
          consumer:
            concurrency: 1

server:
  port: 8080

# OpenSearch Configuration
opensearch:
  cluster:
    url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:admin}
    password: ${OPENSEARCH_PASSWORD:admin}
    connection-timeout-ms: 5000
    socket-timeout-ms: 60000
    max-connections: 100
    max-connections-per-route: 20

  ssl:
    enabled: ${OPENSEARCH_SSL_ENABLED:false}
    verify-hostname: ${OPENSEARCH_SSL_VERIFY_HOSTNAME:true}

# Batch Processing Configuration
batch:
  size: 20
  timeout-seconds: 5
  max-concurrent-batches: 10
  buffer-capacity: 1000

# Retry Configuration
retry:
  max-attempts: 3
  backoff-multiplier: 2
  initial-delay-ms: 1000
  max-delay-ms: 30000

# Dead Letter Queue Configuration
dlq:
  enabled: true
  log-level: WARN
  include-payload: true
  max-payload-size: 10000

# Scheduler Configuration
scheduler:
  health-check:
    enabled: true
    cron: "0 */5 * * * *"
    timeout-seconds: 30

# Index Configuration
index:
  default-shards: 1
  default-replicas: 1
  max-result-window: 10000
  refresh-interval: 1s

# Search Configuration
search:
  default-page-size: 20
  max-page-size: 10000
  scroll-timeout: 5m

# Logging Configuration
logging:
  level:
    root: INFO
    com.opensearch.utility: INFO
    com.opensearch.utility.core.http: DEBUG
    com.opensearch.utility.command.document.listeners: INFO

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
